<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aurora" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#8A6BFF"/>
      <stop offset="0.5" stop-color="#19E3C2"/>
      <stop offset="1" stop-color="#FF5DA2"/>
    </linearGradient>
    <radialGradient id="gV" cx="0.22" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gP" cx="0.84" cy="0.88" r="0.75">
      <stop offset="0" stop-color="#FF5DA2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF5DA2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.48" r="0.42">
      <stop offset="0" stop-color="#19E3C2" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7C5CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base + aurora wash -->
  <rect width="1024" height="1024" fill="#0A0A10"/>
  <rect width="1024" height="1024" fill="url(#gV)"/>
  <rect width="1024" height="1024" fill="url(#gP)"/>

  <!-- soft halo behind the mark -->
  <ellipse cx="520" cy="500" rx="430" ry="430" fill="url(#halo)"/>

  <!-- bold, rounded play triangle (the recap you watch) -->
  <path d="M398 300 L398 724 L760 512 Z"
        fill="url(#aurora)"
        stroke="url(#aurora)" stroke-width="64" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- subtle top highlight for depth -->
  <path d="M398 300 L398 724 L760 512 Z" fill="#FFFFFF" opacity="0.06"/>
</svg>
